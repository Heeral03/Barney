# Postgres with pgvector: LangGraph checkpoints (short-term memory) and the long-term memory store.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lily
      POSTGRES_PASSWORD: lily
      POSTGRES_DB: lily
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lily -d lily"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
